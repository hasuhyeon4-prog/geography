<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>세계지리 강의 표</title>
<style>
:root{--ink:#142d39;--muted:#60727b;--line:#dce4e6;--accent:#086b70;--pale:#e6f2f0;--paper:#fff;--good:#2b8a3e;--bad:#c4441c}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;color:var(--ink);background:#f6f9f9;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;font-size:15px}
button,select{font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;background:#fff}button{cursor:pointer;min-height:44px;padding:8px 12px;font-weight:700;touch-action:manipulation}button:hover{background:#f3f7f7}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #52b4c2;outline-offset:2px}[hidden]{display:none!important}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}.primary:hover{background:#05595d}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;min-height:52px;padding:5px 12px;padding-top:calc(5px + env(safe-area-inset-top));background:#fff;border-bottom:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.nav{display:flex;gap:2px;margin-left:auto}.nav{min-width:0;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav a{font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;padding:9px 6px;border-radius:9px;white-space:nowrap}.nav a[aria-current=page]{background:var(--ink);color:#fff}@media(max-width:380px){.nav a{padding:8px 3px;font-size:11px}}
.navLink{flex-shrink:0;font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid #badcd5;background:var(--pale);border-radius:10px;padding:9px 8px;white-space:nowrap}
.scope{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 12px;background:#fafcfc;border-bottom:1px solid var(--line)}.scope label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;min-width:0}
select{min-height:40px;min-width:0;width:100%;padding:6px;font-size:13px;font-weight:650;color:var(--ink)}
main{max-width:720px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 10px #142d390d;margin-bottom:12px}
.meta{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.5}
.q{font-size:18px;line-height:1.55;font-weight:700;margin:4px 0 12px;word-break:keep-all}
.desc{list-style:none;padding:0;margin:0 0 14px;border:1px solid var(--line);border-radius:12px}.desc li{padding:9px 12px;border-top:1px solid var(--line);line-height:1.55;word-break:keep-all}.desc li:first-child{border-top:0}.desc b{display:block;font-size:12px;color:var(--muted)}
.choices{display:grid;gap:8px}.choices button{text-align:left;font-weight:650;line-height:1.45;word-break:keep-all}
.choices button.right{border-color:var(--good);background:#ebfbee;color:#1f5f2c}.choices button.wrong{border-color:var(--bad);background:#fff4e6;color:#8a3a0c}.choices button:disabled{cursor:default;opacity:1}
.result{border-radius:12px;padding:11px 13px;margin:12px 0;font-size:14px;line-height:1.6}.result.good{background:#ebfbee;color:#1f5f2c}.result.bad{background:#fff4e6;color:#8a3a0c}
.wrap{overflow-x:auto;margin:8px 0}table{border-collapse:collapse;font-size:13px;min-width:100%}th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;line-height:1.5;word-break:keep-all;min-width:7em}th{background:#f3f7f7;font-weight:700}
tr.hit td{background:#fff8db}td.name{font-weight:700;white-space:nowrap;min-width:0}
.big{width:100%;min-height:52px;font-size:16px;border-radius:13px;margin-top:6px}
.small{font-size:12px;line-height:1.5}.muted{color:var(--muted)}h2{font-size:17px;margin:0 0 6px}
.hint{font-size:12px;color:var(--muted);text-align:center}
.oxLink{display:inline-block;margin:0 0 12px;font-weight:700;color:var(--accent);text-decoration:none}.oxLink:hover{text-decoration:underline}
</style>
<link rel="stylesheet" href="assets/site.css?v=20261029-ox1"><script src="assets/site.js?v=20261029-ox1"></script></head>
<body>
<header class="site-header"><h1 class="sr-only">강의 표</h1><nav class="site-nav" aria-label="연습 종류"><a href="index.html">위치</a><a href="classify.html">분류 지도</a><a href="rankings.html">순위표</a><a href="facts.html">OX</a><a href="concepts.html" aria-current="page">강의 표</a><a href="exam.html">기출형</a><a href="materials.html">자료형</a></nav></header>
<div class="scope site-controls"><label for="domainSelect">주제<select id="domainSelect"></select></label></div>
<main id="main" aria-live="polite"></main>
<script src="assets/concept-tables.js?v=20261028-dedupe1"></script>
<script src="assets/goal-tables-data.js?v=20261028-dedupe1"></script>
<script src="assets/goal-tables.js?v=20261028-dedupe1"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)},T=window.WGConceptTables;
if(!T){$('main').textContent='강의 표를 불러오지 못했어요. 새로고침해 주세요.';return}
var goalTables=window.WGGoalTables&&window.WGGoalTableData?WGGoalTables.create(WGGoalTableData):null;
if(goalTables){goalTables.tables.forEach(function(t){t.exams=(T.goalExams||{})[t.id]||t.exams});T={domains:T.domains.concat(goalTables.domains),tables:T.tables.concat(goalTables.tables)}}
function el(tag,props,children){var e=document.createElement(tag);Object.keys(props||{}).forEach(function(k){if(props[k]==null)return;if(k==='text')e.textContent=props[k];else if(k==='onclick')e.onclick=props[k];else if(k==='className')e.className=props[k];else e.setAttribute(k,props[k])});(children||[]).forEach(function(c){if(c!=null&&c!==false)e.appendChild(typeof c==='string'?document.createTextNode(c):c)});return e}
function readStore(){try{var v=JSON.parse(localStorage.getItem('wg_concepts_v1')||'{}');return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}catch(e){return {}}}
var store=readStore();if(!store.history||typeof store.history!=='object')store.history={};
var domainName={};T.domains.forEach(function(d){domainName[d.id]=d.name});
var state={domain:domainName[store.domain]?store.domain:'all',q:null};
function save(){try{localStorage.setItem('wg_concepts_v1',JSON.stringify({domain:state.domain,history:store.history}))}catch(e){}}
function tables(){return T.tables.filter(function(t){return state.domain==='all'||t.domain===state.domain})}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function title(t){return domainName[t.domain]+' · 강의 '+t.lecture}
// Rows are compared within one lecture table only; a table's cells are the answers it defines.
function tableEl(t,hit){
 var head=el('tr',{},[el('th',{text:'구분'})].concat(t.columns.map(function(c){return el('th',{text:c.label})})));
 var body=t.rows.map(function(r,i){return el('tr',{className:i===hit?'hit':null},[el('td',{className:'name',text:r})].concat(t.columns.map(function(c){return el('td',{text:c.cells[i]||'—'})})))});
 return el('div',{className:'wrap'},[el('table',{},[el('thead',{},[head]),el('tbody',{},body)])]);
}
function examsEl(t){return t.exams.length?el('p',{className:'small muted',text:'관련 기출 '+t.exams.length+'문항: '+t.exams.slice(0,4).join(', ')+(t.exams.length>4?' 외':'')}):null}
// A row's name or a part of it inside a cell would give the answer away (t.tokens, built with
// the tables): the row asked about becomes ○○ and any other row △△. With own=-1 every row is ○○.
function mask(text,t,own){
 var list=[];t.tokens.forEach(function(ts,j){ts.forEach(function(x){list.push([x,own<0||j===own?'○○':'△△'])})});
 list.sort(function(a,b){return b[0].length-a[0].length});
 var parts=[text];
 list.forEach(function(x){parts=parts.map(function(p){return typeof p!=='string'?p:p.split(x[0]).reduce(function(acc,seg,k){if(k)acc.push({m:x[1]});acc.push(seg);return acc},[])}).reduce(function(a,b){return a.concat(b)},[])});
 return parts.map(function(p){return typeof p==='string'?p:p.m}).join('');
}
function renderStudy(main){
 var list=tables();
 var noteOf=function(t){return t.studyOnly?el('p',{className:'small muted',text:'표 보기 전용: '+t.studyOnly}):null};
 // The tables are practised as O/X statements on the OX page (2026-10-29).
 var d=T.domains.find(function(x){return x.id===state.domain}),topic=d?'table-'+String(d.section).toLowerCase():'table-all';
 main.append(el('p',{className:'small muted',text:'강의 표 '+list.length+'개. 각 표는 강의가 대상끼리 비교한 그대로입니다. 표의 각 칸은 OX 페이지에서 O/X 문장으로 연습합니다.'}),el('a',{className:'oxLink',href:'facts.html?topic='+topic,text:(d?d.name+' 강의 표':'강의 표 전체')+'를 OX로 풀기 →'}));
 list.forEach(function(t){main.append(el('section',{className:'card'},[el('div',{className:'meta',text:title(t)}),el('h2',{text:t.rows.join(' · ')}),tableEl(t,-1),examsEl(t),noteOf(t)]))});
}
function render(){
 var main=$('main');main.replaceChildren();
 renderStudy(main);
}
$('domainSelect').append(el('option',{value:'all',text:'전체 ('+T.tables.length+'개 표)'}));
T.domains.forEach(function(d){$('domainSelect').append(el('option',{value:d.id,text:d.name+' · '+d.section+' ('+T.tables.filter(function(t){return t.domain===d.id}).length+')'}))});
$('domainSelect').value=state.domain;
$('domainSelect').onchange=function(){state.domain=this.value;save();render()};
render();
})();
</script>
</body>
</html>

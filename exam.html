<div class="below"><details class="card kb" id="knowledge"><summary>이 모드의 배경지식 목록</summary><p class="small muted">회상으로 묻는 관계는 기출·강의가 방향을 명시하고, 항목마다 적은 기간(대개 2015~2025년)의 매년 같은 방향과 출제 기준 차이를 지킨 것만이다. 기준에 못 미쳐도 버리지 않고 아래처럼 다르게 익힌다.</p></details></div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
if(!window.WGEntityKB||!window.WGExamThemes||!window.WGExamEngine){$('main').textContent='문항 자료를 불러오지 못했어요. 새로고침해 주세요.';return}
var engine=WGExamEngine.create(WGEntityKB,WGExamThemes);
// Every question gets a seed so a saved one can be built again exactly (☆ 저장).
function buildQuestion(opts){var o=Object.assign({},opts,{integrated:true});if(o.seed==null)o.seed=1+Math.floor(Math.random()*1e9);var q=engine.build(o);if(q){q.rebuild=JSON.parse(JSON.stringify(o));q.rebuild.themeId=q.theme.id;}return q;}
// 난이도 '어렵게' (2026-10-31): a question is drawn eight times and the hardest kept - 대상 in the
// same region, values close to one another, and <보기> answered by knowledge rather than by reading.
function hardness(q){
 var es=q.entities||[],same=0,close=0,cols=0;
 for(var i=0;i<es.length;i++)for(var j=i+1;j<es.length;j++){var a=WGEntityKB.entities[es[i]],b=WGEntityKB.entities[es[j]];if(a&&b&&a.region&&a.region===b.region)same++}
 ((q.display&&q.display.columns)||[]).forEach(function(c,k){
  var v=c.bar&&c.bar.values||((q.display.rows||[]).map(function(r){return parseFloat(String(r.cells[k]).replace(/,/g,''))}));v=v.filter(isFinite);if(v.length<2)return;
  var gap=1;for(var i=0;i<v.length;i++)for(var j=i+1;j<v.length;j++){var m=Math.max(Math.abs(v[i]),Math.abs(v[j]));if(m)gap=Math.min(gap,Math.abs(v[i]-v[j])/m)}
  close+=Math.max(0,1-gap*4);cols++;
 });
 var recall=q.stage2.statements.filter(function(st){return ['fact','compare','concept','both','sign','place','climateClaim','category'].indexOf(st.kind)>=0}).length;
 // Three 대상 to tell apart are harder than two.
 return same*2+(cols?close/cols*3:0)+recall*.5+Math.max(0,es.length-2);
}
function draw(opts,accept){
 if(state.level!=='hard')return buildQuestion(opts);
 var best=null,score=-1;
 for(var i=0;i<8;i++){var q=buildQuestion(opts);if(!q||accept&&!accept(q))continue;var h=hardness(q);if(h>score){score=h;best=q}}
 return best||buildQuestion(opts);
}
function readStore(){try{var v=JSON.parse(localStorage.getItem('wg_exam_v1')||'{}');return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}catch(e){return {}}}
var store=readStore();if(!store.stats||typeof store.stats!=='object')store.stats={};if(!Array.isArray(store.recent))store.recent=[];
var FORMATS=[['all','전체 형식'],['rows','대상 식별'],['columns','항목 식별 (A~C)'],['joint','동시 식별'],['implicit','실전형 (지도)']];
var state={theme:engine.themes.some(function(t){return t.id===store.theme})?store.theme:'all',format:FORMATS.some(function(f){return f[0]===store.format})?store.format:'all',nameMode:store.nameMode===true,level:store.level==='basic'?'basic':'hard',targetKey:null,q:null,a1:null,a2:null,session:{s1:0,s2:0,n1:0,n2:0}};
function save(){try{localStorage.setItem('wg_exam_v1',JSON.stringify({theme:state.theme,format:state.format,nameMode:state.nameMode,level:state.level,stats:store.stats,recent:store.recent,review:store.review,seen:store.seen,tried:store.tried,types:store.types,count:store.count}))}catch(e){}}
// The last questions shown are not repeated while others can be made (kept across visits).
var RECENT=40;
function el(tag,props,children){var e=document.createElement(tag);Object.keys(props||{}).forEach(function(k){if(props[k]==null)return;if(k==='text')e.textContent=props[k];else if(k==='onclick')e.onclick=props[k];else if(k==='className')e.className=props[k];else e.setAttribute(k,props[k])});(children||[]).forEach(function(c){if(c!=null&&c!==false)e.appendChild(typeof c==='string'?document.createTextNode(c):c)});return e}
function progressEl(o){var p=[];if(o.len)p.push(o.pos+' / '+o.len);p.push('정답 '+o.right+'/'+o.answered);if(o.extra)p.push(o.extra);if(o.review)p.push('다시 풀기 '+o.review);return el('span',{className:'site-progress',role:'status',text:p.join(' · ')});}
// Review: what a wrong answer missed (the comparisons behind a misplaced row, each <보기> judged
// wrongly) comes back in a new question.
if(!store.review||typeof store.review!=='object'||Array.isArray(store.review))store.review={};
// 2026-10-29: a missed comparison or fact waits in 복습 until it is answered right (grade).
function remember(item){var old=store.review[item.key];if(state.reviewItem&&state.reviewItem.key===item.key)return;item.box=0;item.due=Date.now();item.misses=(old&&old.misses||0)+1;store.review[item.key]=item}
function relItem(ind,a,b){var x=engine.relation(ind,a,b);if(!x||['active','belowMargin'].indexOf(x.status)<0)return null;var m=WGEntityKB.indicators[ind];
 return {key:'rel|'+ind+'|'+[a,b].sort().join('|'),build:{targetKey:ind+'|'+[a,b].sort().join('|')},label:(m?m.label:ind)+': '+x.hi+' > '+x.lo}}
function statementItems(q,st){
 var c=st.check||{},th=q.theme.id,short=(st.explain||st.text).split(' (')[0].slice(0,70);
 if(st.kind==='compare'){var x=relItem(c.ind,c.subject,c.object);return x?[x]:[]}
 if(st.kind==='fact')return [{key:'fact|'+th+'|'+c.entity+'|'+c.set,build:{themeId:th,focus:{entity:c.entity,set:c.set}},label:short}];
 if(st.kind==='both')return [c.a,c.b].map(function(n){return {key:'fact|'+th+'|'+n+'|'+c.set,build:{themeId:th,focus:{entity:n,set:c.set}},label:short}});
 var n=c.entity||c.subject||(st.kind==='concept'&&(WGEntityKB.concepts||[]).filter(function(k){return k.id===c.concept}).map(function(k){return k.about[0]})[0]);
 if(n&&q.theme.pool.indexOf(n)>=0)return [{key:'ent|'+th+'|'+n,build:{themeId:th,focus:{entity:n}},label:th===q.theme.id?q.theme.title+' · '+n:n}];
 return [{key:'theme|'+th,build:{themeId:th},label:q.theme.title}];
}
function missed1(q,pick){
 var opt=q.stage1.options[pick],ans=q.stage1.options[q.stage1.answer],out=[],th=q.theme.id;
 if(q.format==='columns'||q.format==='joint')return [{key:'fmt|'+th+'|'+q.format,build:{themeId:th,format:q.format},label:q.theme.title+' · '+(q.format==='joint'?'동시 식별':'항목 식별')}];
 ans.forEach(function(n,i){if(opt[i]===n)return;
  var rels=(q.stage1.basis.relations||[]).filter(function(x){return x.hi===n||x.lo===n}).slice(0,1).map(function(x){return relItem(x.indicator,x.hi,x.lo)}).filter(Boolean);
  out=out.concat(rels.length?rels:[{key:'ent|'+th+'|'+n,build:{themeId:th,focus:{entity:n}},label:q.theme.title+' · '+n}]);
 });
 return out;
}
function missed2(q,pick){
 if(q.readingOnly)return q.stage2.statements.map(function(st){return statementItems(q,st)}).reduce(function(a,b){return a.concat(b)},[]);
 var said=engine.COMBOS[pick],right=engine.COMBOS[q.stage2.answer],out=[];
 q.stage2.statements.forEach(function(st,i){if((said.indexOf(i)>=0)!==(right.indexOf(i)>=0))out=out.concat(statementItems(q,st))});
 return out;
}
// Practice follows the learner (2026-10-23). Each topic × format keeps its last 20 results, and the
// draw weight grows with the cube of what is missed (one weak type among strong ones comes about
// one question in seven); a floor keeps the strong ones coming back. Every other question is
// built around a comparison, fact or 대상 not yet seen, so nothing waits on chance to appear.
['seen','tried','types'].forEach(function(k){if(!store[k]||typeof store[k]!=='object'||Array.isArray(store[k]))store[k]={}});
var INVENTORY=engine.inventory(),PRIOR={rows:.45,implicit:.2,columns:.35};
function results(key){return store.types[key]||[]}
function accuracy(key){var r=results(key),c=r.filter(Boolean).length;return (c+1)/(r.length+2)}
function scopeThemes(){return state.theme==='all'?engine.themes:engine.themes.filter(function(t){return t.id===state.theme})}
// One round asks every topic and format pair once, in random order, and carries on
// across visits; within a pair the questions shown recently are avoided.
function roundQuestion(){
 var pairs=[];scopeThemes().forEach(function(t){engine.formatsFor(t).filter(function(f){return state.format==='all'||f===state.format}).forEach(function(f){pairs.push(t.id+'|'+f)})});
 if(!pairs.length||!(typeof WGOrder!=='undefined'&&WGOrder))return weighted();
 // The pair counts as asked once the question is answered (answer2); one that cannot be built is passed over.
 var scope=state.theme+':'+state.format;
 for(var k=0;k<pairs.length;k++){var pair=WGOrder.peek('exam',scope,pairs),p=pair.split('|'),q=draw({themeId:p[0],format:p[1],completion:true,avoid:store.recent});if(q){q.round={scope:scope,pair:pair};return q}WGOrder.done('exam',scope,pair)}
 return null;
}
function weighted(){
 var pairs=[],sum=0;
 scopeThemes().forEach(function(t){
  var fs=engine.formatsFor(t).filter(function(f){return state.format==='all'||f===state.format});
  var pr=fs.map(function(f){return f==='joint'?.15:f==='columns'&&fs.indexOf('joint')>=0?.2:PRIOR[f]}),tot=pr.reduce(function(a,b){return a+b},0)||1;
  fs.forEach(function(f,i){var need=.15+1-accuracy(t.id+'|'+f),w=pr[i]/tot*Math.max(need*need*need,.02);pairs.push({t:t.id,f:f,w:w});sum+=w});
 });
 for(var k=0;k<3&&pairs.length;k++){
  var x=Math.random()*sum,p=pairs[pairs.length-1];for(var i=0;i<pairs.length;i++){x-=pairs[i].w;if(x<=0){p=pairs[i];break}}
  var q=buildQuestion({themeId:p.t,format:p.f,completion:true,avoid:store.recent});if(q)return q;
 }
 return null;
}

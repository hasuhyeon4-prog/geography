<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--ink:#142d39;--muted:#60727b;--line:#dce4e6;--accent:#086b70;--pale:#e6f2f0;--good:#2b8a3e;--bad:#c4441c}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;color:var(--ink);background:#f6f9f9;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;font-size:15px}
button,select{font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;background:#fff}button{cursor:pointer;min-height:44px;padding:8px 12px;font-weight:700;touch-action:manipulation;text-align:left}button:hover{background:#f3f7f7}button:disabled{cursor:default}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #52b4c2;outline-offset:2px}[hidden]{display:none!important}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;text-align:center}.primary:hover{background:#05595d}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;min-height:52px;padding:5px 10px;padding-top:calc(5px + env(safe-area-inset-top));background:#fff;border-bottom:1px solid var(--line)}
.navLink{flex-shrink:0;font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid #badcd5;background:var(--pale);border-radius:10px;padding:9px 9px;white-space:nowrap}
.nav{display:flex;gap:2px;margin-left:auto}.nav a{font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;padding:9px 7px;border-radius:9px;white-space:nowrap}.nav a[aria-current=page]{background:var(--ink);color:#fff}
.scope{display:flex;gap:10px;align-items:center;padding:8px 12px;background:#fafcfc;border-bottom:1px solid var(--line)}.scope label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;flex:1;min-width:0}
.score{font-size:12px;color:var(--muted);white-space:nowrap}
select{min-height:40px;min-width:0;width:100%;padding:6px;font-size:13px;font-weight:650;color:var(--ink)}
main{max-width:720px;margin:0 auto;padding:12px 12px calc(28px + env(safe-area-inset-bottom))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 10px #142d390d;margin-bottom:12px}
.meta{font-size:12px;color:var(--muted);line-height:1.5}.prompt{font-size:14px;line-height:1.6;margin:8px 0}
.tableWrap{overflow-x:auto;margin:6px 0}table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}th,td{border:1px solid var(--line);padding:6px 7px;text-align:center;white-space:nowrap}th{background:#f3f7f7;font-weight:700;font-size:12px;white-space:normal;word-break:keep-all;min-width:64px}td.items{white-space:normal;text-align:left}td.name{font-weight:700;color:var(--accent)}

h2{font-size:17px;line-height:1.45;margin:14px 0 8px;word-break:keep-all}.step{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--ink);border-radius:6px;padding:2px 6px;margin-right:6px;vertical-align:2px}
.choices{display:grid;gap:7px}.choices button{min-height:48px;font-size:14px;line-height:1.45;border-width:2px;border-radius:12px;word-break:keep-all}
.choices button.right{border-color:var(--good);background:#ebfbee;color:#1f5f2c}.choices button.chosenWrong{border-color:var(--bad);background:#fff4e6;color:#8a3a0c}.choices button:disabled:not(.right):not(.chosenWrong){opacity:.5}
.choices.combo{grid-template-columns:repeat(5,1fr);gap:5px}.choices.combo button{text-align:center;padding:5px 2px;font-size:14px;line-height:1.3}.choices.combo .no{display:block;font-size:12px;color:var(--muted)}.choices.combo .pair{display:block;white-space:nowrap}
.bogi{border:1px solid var(--ink);border-radius:4px;padding:10px 12px;margin:6px 0 10px;font-size:14px;line-height:1.65;position:relative}.bogi:before{content:'<보 기>';position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#fff;padding:0 6px;font-size:12px;font-weight:700}
.bogi p{margin:4px 0;word-break:keep-all}.bogi .mark{font-weight:800;margin-right:4px}.bogi .ox{font-weight:800;margin-left:4px}.bogi .ox.o{color:var(--good)}.bogi .ox.x{color:var(--bad)}
.bogi .why{display:block;font-size:12px;color:var(--muted);margin:1px 0 6px 18px;line-height:1.5}
.result{border-radius:12px;padding:10px 12px;margin:10px 0 4px;font-size:14px;line-height:1.6}.result.good{background:#ebfbee;color:#1f5f2c}.result.bad{background:#fff4e6;color:#8a3a0c}
.cues{margin:4px 0 0;padding-left:18px;font-size:13px;line-height:1.6}
.big{width:100%;min-height:54px;font-size:17px;border-radius:13px;margin-top:10px}
.small{font-size:12px;line-height:1.5}.muted{color:var(--muted)}
.mapBox{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#e7f0f5;margin:8px 0}.mapBox svg{display:block;width:100%;height:auto}
.mapBox .land{fill:#f6f7f2;stroke:#a9b6ba}.mapBox .marked{fill:#ffe3a3;stroke:#8a6a12}.mapBox .pin circle{fill:var(--ink);stroke:#fff}.mapBox .pin text{fill:#fff;font-weight:800;text-anchor:middle;dominant-baseline:central}.mapBox .pinName{fill:var(--ink);font-weight:700;paint-order:stroke;stroke:#fff;dominant-baseline:central}
.climateGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:6px 0}.climateFig{margin:0;border:1px solid var(--line);border-radius:10px;padding:6px 6px 2px}
.climateFig figcaption{font-weight:800;color:var(--accent);font-size:14px}.climateFig svg{display:block;width:100%;height:auto}.climateFig text{font-size:9px;fill:var(--muted)}
.climateFig .bar{fill:#74a9cf}.climateFig .tline{fill:none;stroke:#c4441c;stroke-width:2}.climateFig .tdot{fill:#c4441c}.climateFig .grid{stroke:#e3e9ea}.climateFig .zero{stroke:#9aa8ad}
td.text{white-space:normal;text-align:left;line-height:1.55;word-break:keep-all;min-width:12em}
.numbers summary{cursor:pointer;font-size:12px;color:var(--muted)}.numbers table{font-size:11px}
.toggle{flex:0 0 auto!important;gap:4px!important;cursor:pointer}.toggle input{width:18px;height:18px;margin:0}
.below{max-width:720px;margin:0 auto;padding:0 12px calc(28px + env(safe-area-inset-bottom))}
.kb summary{cursor:pointer;font-weight:800;font-size:15px;min-height:28px}.kb>p{margin:8px 0}.kb details{border-top:1px solid var(--line);padding:8px 0}.kb details summary{font-size:14px;font-weight:700}
.kb ul{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.55}.kb li{margin:4px 0;word-break:keep-all}.kb li span{display:block;font-size:12px;color:var(--muted)}
@media(max-width:360px){.navLink{padding:8px 6px;font-size:11px}.nav a{padding:8px 4px;font-size:11px}.choices.combo button{font-size:12px}}
</style>

<div class="below"><details class="card kb" id="knowledge"><summary>이 모드의 배경지식 목록</summary><p class="small muted">회상으로 묻는 관계는 기출·강의가 방향을 명시하고, 2015~2025년 매년 같은 방향과 출제 기준 차이를 지킨 것만이다. 기준에 못 미쳐도 버리지 않고 아래처럼 다르게 익힌다.</p></details></div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
if(!window.WGEntityKB||!window.WGExamThemes||!window.WGExamEngine){$('main').textContent='문항 자료를 불러오지 못했어요. 새로고침해 주세요.';return}
var engine=WGExamEngine.create(WGEntityKB,WGExamThemes);
function readStore(){try{var v=JSON.parse(localStorage.getItem('wg_exam_v1')||'{}');return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}catch(e){return {}}}
var store=readStore();if(!store.stats||typeof store.stats!=='object')store.stats={};if(!Array.isArray(store.recent))store.recent=[];
var state={theme:engine.themes.some(function(t){return t.id===store.theme})?store.theme:'all',nameMode:store.nameMode===true,targetKey:null,q:null,a1:null,a2:null,session:{s1:0,s2:0,n1:0,n2:0}};
function save(){try{localStorage.setItem('wg_exam_v1',JSON.stringify({theme:state.theme,nameMode:state.nameMode,stats:store.stats,recent:store.recent}))}catch(e){}}
// The last questions shown are not repeated while others can be made (kept across visits).
var RECENT=40;
function el(tag,props,children){var e=document.createElement(tag);Object.keys(props||{}).forEach(function(k){if(props[k]==null)return;if(k==='text')e.textContent=props[k];else if(k==='onclick')e.onclick=props[k];else if(k==='className')e.className=props[k];else e.setAttribute(k,props[k])});(children||[]).forEach(function(c){if(c!=null&&c!==false)e.appendChild(typeof c==='string'?document.createTextNode(c):c)});return e}
function record(themeId,stage,ok){var s=store.stats[themeId]||(store.stats[themeId]={s1:[0,0],s2:[0,0]});s[stage][1]++;if(ok)s[stage][0]++;save()}
function next(){
 state.q=engine.build({themeId:state.targetKey||state.theme==='all'?null:state.theme,targetKey:state.targetKey,avoid:store.recent});
 if(state.q&&state.q.signature){store.recent=store.recent.filter(function(x){return x!==state.q.signature}).concat([state.q.signature]).slice(-RECENT);save()}state.a1=state.q&&(state.q.readingOnly||state.q.stage1.implicit)?-1:null;state.a2=null;render();window.scrollTo({top:0});
}
// Climate graphs: precipitation bars (right scale, mm) and temperature line (left scale, ℃),
// every graph on the same scale.
function climateCharts(q,revealed){
 var d=q.display,sc=d.scale,W=230,H=150,pl=26,pr=30,pt=12,pb=18,iw=W-pl-pr,ih=H-pt-pb;
 var x=function(m){return pl+iw*(m+.5)/12},yT=function(t){return pt+ih*(sc.tMax-t)/(sc.tMax-sc.tMin)},yP=function(p){return pt+ih*(1-p/sc.pMax)};
 var grid=el('div',{className:'climateGrid'});
 d.rows.forEach(function(row,i){
  var svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':row.label+' 기후 그래프'});
  for(var t=sc.tMin;t<=sc.tMax;t+=10){svgEl('line',{x1:pl,x2:W-pr,y1:yT(t),y2:yT(t),class:t===0?'zero':'grid'},svg);svgEl('text',{x:pl-3,y:yT(t)+3,'text-anchor':'end'},svg,String(t))}
  for(var k=0;k<=4;k++){var p=sc.pMax*k/4;svgEl('text',{x:W-pr+3,y:yP(p)+3},svg,String(Math.round(p)))}
  svgEl('text',{x:pl-3,y:8,'text-anchor':'end'},svg,'℃');svgEl('text',{x:W-pr+3,y:8},svg,'mm');
  row.precipitation.forEach(function(p,m){svgEl('rect',{x:(x(m)-iw/30).toFixed(1),y:yP(p).toFixed(1),width:(iw/15).toFixed(1),height:Math.max(0,yP(0)-yP(p)).toFixed(1),class:'bar'},svg)});
  svgEl('polyline',{points:row.temperature.map(function(t,m){return x(m).toFixed(1)+','+yT(t).toFixed(1)}).join(' '),class:'tline'},svg);
  row.temperature.forEach(function(t,m){svgEl('circle',{cx:x(m).toFixed(1),cy:yT(t).toFixed(1),r:1.6,class:'tdot'},svg)});
  [1,4,7,10].forEach(function(m){svgEl('text',{x:x(m-1),y:H-5,'text-anchor':'middle'},svg,m+'월')});
  grid.append(el('figure',{className:'climateFig'},[el('figcaption',{text:row.label+(revealed?' '+q.entities[i]:'')}),svg]));
 });
 // Exact monthly values, for checking a reading and for screen readers.
 var months=[];for(var m=1;m<=12;m++)months.push(String(m));
 var rows=[];d.rows.forEach(function(row){rows.push(el('tr',{},[el('td',{className:'name',text:row.label+' 기온(℃)'})].concat(row.temperature.map(function(v){return el('td',{text:String(v)})}))));rows.push(el('tr',{},[el('td',{className:'name',text:row.label+' 강수(mm)'})].concat(row.precipitation.map(function(v){return el('td',{text:String(Math.round(v))})}))))});
 var numbers=el('details',{className:'numbers'},[el('summary',{text:'월별 수치 보기'}),el('div',{className:'tableWrap'},[el('table',{},[el('thead',{},[el('tr',{},[el('th',{text:'월'})].concat(months.map(function(m){return el('th',{text:m})})))]),el('tbody',{},rows)])])]);
 return el('div',{},[grid,numbers,el('div',{className:'source',text:'자료: '+d.source})]);
}
function table(q,revealed){
 if(q.display.kind==='climate')return climateCharts(q,revealed);
 // 항목 식별 hides column names as A~C until stage 1 is answered; rows already carry names.
 var d=q.display,head=el('tr',{},[el('th',{text:'구분'})].concat(d.columns.map(function(c){return el('th',{text:c.label+(revealed&&c.reveal?' '+c.reveal:'')+(c.unit?' ('+c.unit+')':'')})})));
 var body=d.rows.map(function(r,i){return el('tr',{},[el('td',{className:'name',text:r.label+(revealed&&q.format!=='columns'?' '+q.entities[i]:'')})].concat(r.cells.map(function(c){return el('td',{className:q.theme.kind==='items'?'items':q.theme.kind==='clues'?'text':null,text:c})})))});
 return el('div',{},[el('div',{className:'tableWrap'},[el('table',{},[el('thead',{},[head]),el('tbody',{},body)])]),el('div',{className:'source',text:'자료: '+d.source})]);
}
// The boundaries (about 1 MB) load only when a map question first appears.
var shapes=window.WGCountryShapes?'ready':'idle',geoCache={};
function needShapes(){
 if(shapes!=='idle')return;shapes='loading';
 var s=document.createElement('script');s.src='assets/country-boundaries.js?v=20261021-1';
 s.onload=function(){shapes=window.WGCountryShapes?'ready':'failed';render()};s.onerror=function(){shapes='failed';render()};document.head.appendChild(s);
}
function mapMode(q){return !!(q&&q.stage1&&q.stage1.markers)&&!state.nameMode}
function letterOf(q,name){var m=q.stage1.markers&&q.stage1.markers.find(function(x){return x.name===name});return m?m.letter:null}
function countryGeo(name){
 if(geoCache[name])return geoCache[name];
 var polys=WGCountryShapes.byName[name].polygons,b=[180,90,-180,-90];
 polys.forEach(function(p){p[0].forEach(function(pt){if(pt[0]<b[0])b[0]=pt[0];if(pt[1]<b[1])b[1]=pt[1];if(pt[0]>b[2])b[2]=pt[0];if(pt[1]>b[3])b[3]=pt[1]})});
 return geoCache[name]={polys:polys,box:b};
}
// Frame the marked places with some sea around them, at a readable aspect ratio.
function mapView(q){
 var f=null;
 q.stage1.markers.forEach(function(m){var e=WGEntityKB.entities[m.name],b=(e&&e.frame)||[m.point[0]-4,m.point[1]-4,m.point[0]+4,m.point[1]+4];
  // A country spanning far (러시아) is framed around its letter instead of its whole land.
  if(b[2]-b[0]>70)b=[m.point[0]-20,Math.max(b[1],m.point[1]-15),m.point[0]+20,Math.min(b[3],m.point[1]+15)];
  f=f?[Math.min(f[0],b[0]),Math.min(f[1],b[1]),Math.max(f[2],b[2]),Math.max(f[3],b[3])]:b.slice()});
 var pad=Math.max(f[2]-f[0],f[3]-f[1])*.08+3;f=[f[0]-pad,f[1]-pad,f[2]+pad,f[3]+pad];
 var w=f[2]-f[0],h=f[3]-f[1];
 if(w<h*1.4){var dx=(h*1.4-w)/2;f[0]-=dx;f[2]+=dx}else if(w>h*2.2){var dy=(w/2.2-h)/2;f[1]-=dy;f[3]+=dy}
 return [Math.max(-180,f[0]),Math.max(-75,f[1]),Math.min(180,f[2]),Math.min(85,f[3])];
}
function svgEl(tag,attrs,parent,text){var e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.keys(attrs).forEach(function(k){e.setAttribute(k,attrs[k])});if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
function drawMap(q,revealed){
 if(shapes!=='ready'){needShapes();return el('p',{className:'small muted',text:shapes==='failed'?'지도를 불러오지 못했어요. 위의 "이름으로"를 켜면 이름 후보로 풀 수 있어요.':'지도를 불러오는 중…'})}
 var v=mapView(q),x0=(v[0]+180)*10,y0=(90-v[3])*10,w=(v[2]-v[0])*10,h=(v[3]-v[1])*10,tol=(v[2]-v[0])/500;
 var svg=svgEl('svg',{viewBox:[x0,y0,w,h].map(function(n){return n.toFixed(1)}).join(' '),role:'img','aria-label':'국가가 '+q.stage1.markers.map(function(m){return m.letter}).join('·')+'로 표시된 지도'});
 var marked={};q.stage1.markers.forEach(function(m){marked[m.name]=1});
 Object.keys(WGCountryShapes.byName).forEach(function(n){
  var g=countryGeo(n),b=g.box;if(b[2]<v[0]||b[0]>v[2]||b[3]<v[1]||b[1]>v[3])return;
  var d=g.polys.map(function(poly){return poly.map(function(ring){var last=null,out=[];ring.forEach(function(p,i){if(!last||i===ring.length-1||Math.abs(p[0]-last[0])>tol||Math.abs(p[1]-last[1])>tol){out.push(p);last=p}});
   return out.length<3?'':out.map(function(p,i){return (i?'L':'M')+((p[0]+180)*10).toFixed(1)+' '+((90-p[1])*10).toFixed(1)}).join('')+'Z'}).join('')}).join('');
  if(d)svgEl('path',{d:d,class:marked[n]?'marked':'land','fill-rule':'evenodd','vector-effect':'non-scaling-stroke'},svg);
 });
 // Pins keep a readable size on screen (about 9px radius) however wide the frame is.
 var unit=w/Math.max(240,Math.min(700,(document.documentElement.clientWidth||700)-40)),r=Math.max(w/55,9*unit),fs=Math.max(w/40,13*unit);
 // Nudge pins apart so two nearby letters never cover each other.
 var pos=q.stage1.markers.map(function(m){return {x:(m.point[0]+180)*10,y:(90-m.point[1])*10}});
 for(var it=0;it<30;it++)for(var i=0;i<pos.length;i++)for(var j=i+1;j<pos.length;j++){
  var dx=pos[j].x-pos[i].x,dy=pos[j].y-pos[i].y,d=Math.hypot(dx,dy)||.01,need=r*2.4;
  if(d<need){var k=(need-d)/2/d;pos[i].x-=dx*k;pos[i].y-=dy*k;pos[j].x+=dx*k;pos[j].y+=dy*k}
 }
 q.stage1.markers.forEach(function(m,mi){
  var x=pos[mi].x,y=pos[mi].y,g=svgEl('g',{class:'pin'},svg);
  svgEl('circle',{cx:x.toFixed(1),cy:y.toFixed(1),r:r.toFixed(1),'stroke-width':(r/6).toFixed(1)},g);
  svgEl('text',{x:x.toFixed(1),y:y.toFixed(1),'font-size':(fs*.9).toFixed(1)},g,m.letter);
  if(revealed)svgEl('text',{x:(x+r*1.3).toFixed(1),y:y.toFixed(1),'font-size':(fs*.75).toFixed(1),'stroke-width':(fs/6).toFixed(1),class:'pinName'},svg,m.name);
 });
 return el('div',{className:'mapBox'},[svg]);
}
function assignment(q,opt,revealed){
 if(q.format==='columns')return opt.map(function(id,i){return q.stage1.labels[i]+' '+q.stage1.names[id]}).join(' · ');
 // 동시 식별: the 대상 of each row, then the name of each column A~C.
 if(q.format==='joint')return opt.slice(0,q.stage1.rows).map(function(n,i){return q.labels[i]+' '+n}).join(' · ')+'  /  '+opt.slice(q.stage1.rows).map(function(id,j){return q.stage1.labels[j]+' '+q.stage1.names[id]}).join(' · ');
 return opt.map(function(n,i){var l=mapMode(q)&&letterOf(q,n);return q.labels[i]+' '+(l?l+(revealed?' '+n:''):n)}).join(' · ');
}
function render(){
 var main=$('main'),q=state.q;main.replaceChildren();
 $('score').textContent=state.session.n1||state.session.n2?('식별 '+state.session.s1+'/'+state.session.n1+' · 판단 '+state.session.s2+'/'+state.session.n2):'';
 if(!q){main.append(el('section',{className:'card'},[el('p',{text:'이 주제로 문항을 만들지 못했어요. 다른 주제를 골라 주세요.'})]));return}
 var t=q.theme,card=el('section',{className:'card'});
 if(state.targetKey)card.append(el('p',{className:'small',text:'선택한 비교를 집중 연습하고 있어요. 주제를 바꾸면 전체 연습으로 돌아갑니다.'}));
 // 실전형 asks the <보기> straight away, as on the exam paper; the identification is shown afterwards.
 var implicit=!!q.stage1.implicit&&!q.readingOnly,revealed=implicit?state.a2!==null:state.a1!==null;
 var kind=q.readingOnly?'':q.format==='columns'?'항목 식별 · ':q.format==='joint'?'동시 식별 · ':implicit?'실전형 · ':'대상 식별 · ';
 card.append.apply(card,[el('div',{className:'meta',text:kind+t.title+' · '+t.lecture+(t.exams&&t.exams.length?' · 기출 유형: '+t.exams.join(', '):'')}),el('p',{className:'prompt',text:(mapMode(q)&&q.mapPrompt)||q.prompt||t.prompt}),mapMode(q)?drawMap(q,revealed):null,table(q,revealed)].filter(Boolean));
 if(t.note)card.append(el('p',{className:'small muted',text:t.note}));
 // Stage 1: identification.
 if(!q.readingOnly&&!implicit)card.append(el('h2',{},[el('span',{className:'step',text:'1차 식별'}),q.stage1.question]));
 var c1=el('div',{className:'choices'});
 q.stage1.options.forEach(function(opt,i){
  var b=el('button',{type:'button','data-i':String(i)},['①②③④⑤'[i]+' '+assignment(q,opt,state.a1!==null)]);
  if(state.a1!==null){b.disabled=true;if(i===q.stage1.answer)b.className='right';else if(i===state.a1)b.className='chosenWrong'}
  else b.onclick=function(){answer1(i)};
  c1.append(b);
 });
 if(!q.readingOnly&&!implicit)card.append(c1);
 var cueList=function(){return el('ul',{className:'cues'},q.stage1.cues.map(function(c){return el('li',{text:c.label+' '+c.name+(c.letter&&mapMode(q)?' ('+c.letter+')':'')+' — '+c.cue})}))};
 if(state.a1!==null){
  var ok1=state.a1===q.stage1.answer;
  if(!q.readingOnly&&!implicit)card.append(el('div',{className:'result '+(ok1?'good':'bad'),role:'status'},[el('b',{text:ok1?'식별 정답':'식별 오답'}),cueList()]));
  // Stage 2: judgments about the identified 대상.
  card.append(el('h2',{},[el('span',{className:'step',text:'후속 판단'}),q.stage2.question]));
  var bogi=el('div',{className:'bogi'});
  q.stage2.statements.forEach(function(s){
   var line=el('p',{},[el('span',{className:'mark',text:s.mark+'.'}),s.text]);
   if(state.a2!==null)line.append(el('span',{className:'ox '+(s.truth?'o':'x'),text:s.truth?' ○':' ×'}),el('span',{className:'why',text:s.explain}));
   bogi.append(line);
  });
  card.append(bogi);
  var c2=el('div',{className:q.readingOnly?'choices':'choices combo'});
  q.stage2.options.forEach(function(o,i){
   var b=el('button',{type:'button','aria-label':o.mark+' '+o.text},[el('span',{className:'no',text:o.mark}),el('span',{className:'pair',text:o.text})]);
   if(state.a2!==null){b.disabled=true;if(i===q.stage2.answer)b.className='right';else if(i===state.a2)b.className='chosenWrong'}
   else b.onclick=function(){answer2(i)};
   c2.append(b);
  });
  card.append(c2);
 }
 if(state.a2!==null){
  var ok2=state.a2===q.stage2.answer;
  if(implicit)card.append(el('div',{className:'result good',role:'status'},[el('b',{text:'식별 근거'}),cueList()]));
  card.append(el('div',{className:'result '+(ok2?'good':'bad'),role:'status',text:ok2?'후속 판단 정답':'후속 판단 오답 — 각 보기 아래의 근거를 확인하세요.'}));
  var nb=el('button',{type:'button',className:'primary big',text:'다음 문항',onclick:next});card.append(nb);
 }
 main.append(card);
 var focus=state.a2!==null?main.querySelector('.big'):state.a1!==null?main.querySelector('.combo button'):null;
 if(focus){focus.focus({preventScroll:true});focus.scrollIntoView({block:'nearest'})}
}
function answer1(i){if(state.a1!==null||i<0||i>=state.q.stage1.options.length)return;state.a1=i;var ok=i===state.q.stage1.answer;state.session.n1++;if(ok)state.session.s1++;record(state.q.theme.id,'s1',ok);render()}
function answer2(i){if(state.a1===null||state.a2!==null||i<0||i>=state.q.stage2.options.length)return;state.a2=i;var ok=i===state.q.stage2.answer;state.session.n2++;if(ok)state.session.s2++;record(state.q.theme.id,'s2',ok);render()}
// What the mode recalls, what it only shows as data, and why.
function knowledge(){
 var kb=WGEntityKB,n=function(v){return Number(v).toLocaleString('ko-KR')};
 var sample=kb.practiceSample?kb.practiceSample.seedsPerTheme*kb.practiceSample.themes.length:0;
 function cat(c,id){var row=c.categories.find(function(k){return k[0]===id});return row?row[1]:id}
 function title(x){
  if(x.lecture)return '기후형: '+x.entity+' — '+(kb.climate.types[x.lecture]||x.lecture);
  if(x.trait){var cc=kb.compositions[x.composition];return '종교의 특징 · '+x.label+': '+(x.kind==='order'?x.order.map(function(id){return cat(cc,id)}).join(' > ')+(x.id==='founded'?' (먼저 발생한 순)':''):Object.keys(x.values).map(function(id){return cat(cc,id)+' '+x.values[id]}).join(' · '))}
  if(x.first)return kb.indicators[x.indicator].label+': '+x.hi+' 세계 1위 — 이 주제의 다른 '+x.count+'개국보다 많음';
  if(x.hi)return kb.indicators[x.indicator].label+': '+x.hi+' > '+x.lo;
  if(x.order){var c=kb.compositions[x.composition];return ({religion:'종교 인구',exports:'상품 수출 구성',electricity:'전력 생산'}[x.composition]||x.composition)+': '+x.entity+' — '+x.order.map(function(id){return cat(c,id)}).join(' > ')+(x.order.length===1?' 1위':'')}
  var m=kb.indicators[x.indicator];return m.label+': '+x.entity+' — '+((x.positive?m.sign.pos:m.sign.neg)||(x.positive?'양(+)':'음(−)'));
 }
 function detail(x){
  if(x.status!=='active')return x.reason;
  if(x.trait)return (x.years?x.years.join('·')+'년 '+x.source+' · 최소 간격 '+x.minGap+'%p · ':'강의 설명 · ')+'A~C를 식별한 뒤 묻는 <보기>'+(sample?' · 표본 '+n(sample)+'문항 중 '+n(x.practice)+'회':'');
  if(x.lecture)return '관측소 평년값으로 같은 기후형 확인('+x.computed.split('').map(function(ch,i){return i===0||(i===1&&/[be]/.test(x.computed[0]))?ch.toUpperCase():ch}).join('')+')'+(sample?' · 표본 '+n(sample)+'문항 중 '+n(x.practice)+'회':'');
  var m=x.indicator&&kb.indicators[x.indicator],span=m&&m.static?x.years.join('·')+'년 기준':x.years[0]+'~'+x.years[1]+'년 매년';
  var gap=x.first?'':x.hi?' · 최소 차이 '+x.minGap:x.order?' · 최소 간격 '+x.minGap+'%p':' · 최소 절댓값 '+x.minAbs+m.unit;
  return span+gap+(sample?' · 표본 '+n(sample)+'문항 중 '+n(x.practice)+'회':'');
 }
 // A world first place is checked pair by pair against the theme's countries; it is listed once.
 var firsts={},rels=kb.relations.filter(function(x){
  if(x.form!=='first'||x.status!=='active')return true;
  var g=firsts[x.indicator+'|'+x.hi]||(firsts[x.indicator+'|'+x.hi]=Object.assign({},x,{first:true,count:0,practice:0}));
  g.count++;g.practice+=x.practice||0;return false;
 });
 var traits=[];Object.keys(kb.categoryFacts||{}).forEach(function(cid){kb.categoryFacts[cid].forEach(function(f){traits.push(Object.assign({trait:true},f))})});
 var all=rels.concat(Object.keys(firsts).map(function(k){return firsts[k]}),kb.signs,kb.orders,traits,(kb.climate&&kb.climate.verdicts)||[]);
 [['회상으로 출제',function(x){return x.status==='active'&&x.practice>0},'문항의 식별 근거나 <보기>로 나온다.'],
  ['검증 통과 · 이 모드에서는 아직 나오지 않음',function(x){return x.status==='active'&&!x.practice},'이 대상들을 한 문항에서 함께 식별할 지표(수출 구성·제조업 비중 등)가 아직 없다. 관계는 익혀 둔다.'],
  ['방향은 매년 같음 · 차이가 작아 회상 출제에서 제외',function(x){return x.status==='belowMargin'},'관계는 익힌다. 문제에서는 수치를 주고 판단하게 한다.'],
  ['연도에 따라 바뀜 · 제시 자료로만 판단',function(x){return x.status==='reversed'},'어느 쪽인지 외우지 않는다. 자료가 주어지면 그 값으로 판단한다.'],
  ['기출 제시값과 현재 자료가 다름 · 원인 확인 전',function(x){return x.status==='conflict'},'기출 자료를 그대로 읽는다. 두 시점의 순서를 따로 외우지 않는다.'],
  ['그 밖의 제외',function(x){return x.status==='excluded'},'']
 ].forEach(function(g){
  var list=all.filter(g[1]);if(!list.length)return;
  $('knowledge').append(el('details',{},[el('summary',{text:g[0]+' ('+list.length+')'}),g[2]?el('p',{className:'small muted',text:g[2]}):null,
   el('ul',{},list.map(function(x){
    var given=x.given?'기출 자료('+x.given.source+', '+x.given.year+'년): '+(x.given.rankedEntities?'순서 '+x.given.rankedEntities.join(' > '):Object.keys(x.given.values).map(function(k){return k+' '+x.given.values[k]+x.given.unit}).join(' · '))+' — '+x.given.note:null;
    var practice=x.hi&&!x.first&&['active','belowMargin'].indexOf(x.status)>=0?el('button',{type:'button',className:'small',text:x.status==='active'?'이 비교 연습':'자료로 비교 연습',onclick:function(){state.targetKey=x.indicator+'|'+[x.hi,x.lo].sort().join('|');next()}}):null;
    return el('li',{},[title(x),el('span',{text:detail(x)}),given?el('span',{text:given}):null,el('span',{text:'근거: '+x.basis}),practice]);
   }))]));
 });
}
knowledge();
$('themeSelect').append(el('option',{value:'all',text:'전체 무작위 ('+engine.themes.length+'개 주제)'}));
engine.themes.forEach(function(t){$('themeSelect').append(el('option',{value:t.id,text:t.title}))});

$('nameMode').checked=state.nameMode;
$('nameMode').onchange=function(){state.nameMode=this.checked;save();render()};

document.addEventListener('keydown',function(e){
 if(e.target.tagName==='SELECT'||e.altKey||e.ctrlKey||e.metaKey||!state.q)return;
 var n=parseInt(e.key,10);
 if(n>=1&&n<=5){e.preventDefault();if(state.a1===null)answer1(n-1);else if(state.a2===null)answer2(n-1)}
});

})();
